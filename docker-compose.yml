services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spotify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/spotify
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data  # Mount data directory for custom CSV files
      - .:/app  # Mount source code for development
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
